  // Tool Switching
  function setTool(toolName) {
    if (state.tool === 'text' && toolName !== 'text') {
      commitInlineText(true);
    }
    state.tool = toolName;
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tool === toolName);
    });
    window.tuxAudio.playPop(580);
    updateSubOptions();
    updateStampPreview();
  }

  // Left Sidebar Click Handlers
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tool = btn.dataset.tool;
      const action = btn.dataset.action;

      if (action === 'undo') undo();
      else if (action === 'redo') redo();
      else if (action === 'new') { commitInlineText(true); openModal('modalNew'); }
      else if (action === 'open') { commitInlineText(true); fileInput.click(); }
      else if (action === 'save') { commitInlineText(true); saveDrawing(); }
      else if (action === 'copy') copyDrawingToClipboard();
      else if (action === 'print') { commitInlineText(true); window.print(); }
      else if (tool) setTool(tool);
    });
  });

  // Coordinates Mapping
  function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  let previewSnapshot = null;

  // Pointer Down on Canvas
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);

    const { x, y } = getCoords(e);
    state.lastX = x; state.lastY = y;
    state.startX = x; state.startY = y;

    if (state.tool === 'text') {
      openInlineTextEditor(x, y);
      state.isDrawing = false;
      return;
    }

    if (inlineTextEditor && inlineTextEditor.style.display !== 'none') {
      commitInlineText(true);
    }

    if (state.tool === 'stamp') {
      stampAt(x, y);
      state.isDrawing = false;
      return;
    }

    if (state.tool === 'fill') {
      floodFill(x, y, state.currentColor);
      state.isDrawing = false;
      return;
    }

    state.isDrawing = true;

    if (state.tool === 'shapes' || state.tool === 'lines') {
      previewSnapshot = document.createElement('canvas');
      previewSnapshot.width = canvas.width;
      previewSnapshot.height = canvas.height;
      previewSnapshot.getContext('2d').drawImage(canvas, 0, 0);
    }

    if (state.tool === 'brush') {
      drawBrushPoint(x, y);
      window.tuxAudio.playBrush(state.brushSize);
    } else if (state.tool === 'eraser') {
      eraseAt(x, y);
      window.tuxAudio.playEraser();
    } else if (state.tool === 'magic') {
      applyMagic(x, y, x, y);
    }
  });

  // Pointer Move on Canvas
  canvas.addEventListener('pointermove', (e) => {
    const { x, y } = getCoords(e);

    if (state.tool === 'stamp') {
      stampPreview.style.display = 'block';
      stampPreview.style.left = `${e.clientX}px`;
      stampPreview.style.top = `${e.clientY}px`;
    }

    if (!state.isDrawing) return;

    if (state.tool === 'brush') {
      drawBrushSegment(state.lastX, state.lastY, x, y);
      state.lastX = x; state.lastY = y;
      if (Math.random() < 0.25) window.tuxAudio.playBrush(state.brushSize);
    } else if (state.tool === 'eraser') {
      eraseAt(x, y);
      state.lastX = x; state.lastY = y;
      if (Math.random() < 0.25) window.tuxAudio.playEraser();
    } else if (state.tool === 'magic') {
      applyMagic(x, y, state.lastX, state.lastY);
      state.lastX = x; state.lastY = y;
    } else if (state.tool === 'lines' && previewSnapshot) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(previewSnapshot, 0, 0);
      drawLinePreview(state.startX, state.startY, x, y);
    } else if (state.tool === 'shapes' && previewSnapshot) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(previewSnapshot, 0, 0);
      drawShapePreview(state.startX, state.startY, x, y);
    }
  });

  function stopDrawing() {
    if (!state.isDrawing) return;
    state.isDrawing = false;
    if (state.tool === 'lines' || state.tool === 'shapes') {
      window.tuxAudio.playBoing();
    }
    previewSnapshot = null;
    saveSnapshot();
  }

  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);
  canvas.addEventListener('pointerleave', () => {
    stampPreview.style.display = 'none';
  });

  // Brush Primitives (33 Shapes)
  function drawBrushPoint(x, y) {
    ctx.save();
    ctx.fillStyle = state.currentColor;
    ctx.strokeStyle = state.currentColor;
    const s = state.brushSize;

    if (state.brushShape.startsWith('circle')) {
      ctx.beginPath();
      ctx.arc(x, y, s / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (state.brushShape === 'square') {
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    } else if (state.brushShape === 'triangle') {
      ctx.beginPath();
      ctx.moveTo(x, y - s * 0.55);
      ctx.lineTo(x + s * 0.5, y + s * 0.45);
      ctx.lineTo(x - s * 0.5, y + s * 0.45);
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(x, y - s * 0.5);
      ctx.lineTo(x + s * 0.5, y);
      ctx.lineTo(x, y + s * 0.5);
      ctx.lineTo(x - s * 0.5, y);
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'star5') {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const outerAngle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const innerAngle = outerAngle + Math.PI / 5;
        const ox = x + Math.cos(outerAngle) * (s * 0.5);
        const oy = y + Math.sin(outerAngle) * (s * 0.5);
        const ix = x + Math.cos(innerAngle) * (s * 0.22);
        const iy = y + Math.sin(innerAngle) * (s * 0.22);
        if (i === 0) ctx.moveTo(ox, oy);
        else ctx.lineTo(ox, oy);
        ctx.lineTo(ix, iy);
      }
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'star8') {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const oa = (i * Math.PI) / 4 - Math.PI / 2;
        const ia = oa + Math.PI / 8;
        const ox = x + Math.cos(oa) * (s * 0.5);
        const oy = y + Math.sin(oa) * (s * 0.5);
        const ix = x + Math.cos(ia) * (s * 0.25);
        const iy = y + Math.sin(ia) * (s * 0.25);
        if (i === 0) ctx.moveTo(ox, oy);
        else ctx.lineTo(ox, oy);
        ctx.lineTo(ix, iy);
      }
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'heart') {
      const r = s * 0.45;
      ctx.beginPath();
      ctx.moveTo(x, y + r * 0.6);
      ctx.bezierCurveTo(x - r * 1.2, y - r * 0.5, x - r * 0.6, y - r * 1.1, x, y - r * 0.3);
      ctx.bezierCurveTo(x + r * 0.6, y - r * 1.1, x + r * 1.2, y - r * 0.5, x, y + r * 0.6);
      ctx.fill();
    } else if (state.brushShape === 'cross') {
      // Cruz Tradicional (Cruz Latina): haste vertical longa e barra transversal posicionada no terço superior
      const w = Math.max(2, s * 0.24);
      ctx.fillRect(x - w / 2, y - s * 0.5, w, s);
      const barW = s * 0.75;
      ctx.fillRect(x - barW / 2, y - s * 0.18 - w / 2, barW, w);
    } else if (state.brushShape === 'plus') {
      // Sinal de Mais '+': perfeitamente simétrico e equilátero
      const w = Math.max(2, s * 0.25);
      const arm = s * 0.85;
      ctx.fillRect(x - w / 2, y - arm / 2, w, arm);
      ctx.fillRect(x - arm / 2, y - w / 2, arm, w);
    } else if (state.brushShape === 'pentagon') {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
        const px = x + Math.cos(a) * (s * 0.5);
        const py = y + Math.sin(a) * (s * 0.5);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'hexagon') {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI * 2) / 6;
        const px = x + Math.cos(a) * (s * 0.5);
        const py = y + Math.sin(a) * (s * 0.5);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'octagon') {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI * 2) / 8 + Math.PI / 8;
        const px = x + Math.cos(a) * (s * 0.5);
        const py = y + Math.sin(a) * (s * 0.5);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'flower') {
      const pr = s * 0.22;
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * (s * 0.28), y + Math.sin(a) * (s * 0.28), pr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(x, y, pr * 0.8, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
    } else if (state.brushShape === 'splatter') {
      ctx.beginPath();
      ctx.arc(x, y, s * 0.25, 0, Math.PI * 2);
      ctx.fill();
      const offsets = [
        { dx: -0.35, dy: -0.3, r: 0.12 },
        { dx: 0.38, dy: -0.28, r: 0.1 },
        { dx: 0.32, dy: 0.35, r: 0.14 },
        { dx: -0.3, dy: 0.38, r: 0.08 }
      ];
      offsets.forEach(o => {
        ctx.beginPath();
        ctx.arc(x + o.dx * s, y + o.dy * s, s * o.r, 0, Math.PI * 2);
        ctx.fill();
      });
    } else if (state.brushShape === 'moon') {
      ctx.beginPath();
      ctx.arc(x, y, s * 0.45, -Math.PI * 0.4, Math.PI * 0.8, false);
      ctx.quadraticCurveTo(x + s * 0.1, y, x + s * 0.15, y - s * 0.4);
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'lightning') {
      ctx.beginPath();
      ctx.moveTo(x - s * 0.1, y - s * 0.5);
      ctx.lineTo(x + s * 0.3, y - s * 0.5);
      ctx.lineTo(x + s * 0.05, y - s * 0.1);
      ctx.lineTo(x + s * 0.35, y - s * 0.1);
      ctx.lineTo(x - s * 0.25, y + s * 0.5);
      ctx.lineTo(x - s * 0.05, y + s * 0.05);
      ctx.lineTo(x - s * 0.3, y + s * 0.05);
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'arrow') {
      ctx.beginPath();
      ctx.moveTo(x, y - s * 0.5);
      ctx.lineTo(x + s * 0.4, y);
      ctx.lineTo(x + s * 0.18, y);
      ctx.lineTo(x + s * 0.18, y + s * 0.5);
      ctx.lineTo(x - s * 0.18, y + s * 0.5);
      ctx.lineTo(x - s * 0.18, y);
      ctx.lineTo(x - s * 0.4, y);
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'calligraphy-r') {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 4);
      ctx.fillRect(-s * 0.15, -s * 0.5, s * 0.3, s);
      ctx.restore();
    } else if (state.brushShape === 'calligraphy-l') {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-s * 0.15, -s * 0.5, s * 0.3, s);
      ctx.restore();
    } else if (state.brushShape === 'ring') {
      ctx.lineWidth = Math.max(2, s * 0.25);
      ctx.beginPath();
      ctx.arc(x, y, s * 0.38, 0, Math.PI * 2);
      ctx.stroke();
    } else if (state.brushShape === 'double-circle') {
      ctx.lineWidth = Math.max(1.5, s * 0.14);
      ctx.beginPath();
      ctx.arc(x, y, s * 0.42, 0, Math.PI * 2);
      ctx.arc(x, y, s * 0.2, 0, Math.PI * 2);
      ctx.stroke();
    } else if (state.brushShape === 'target') {
      ctx.lineWidth = Math.max(2, s * 0.18);
      ctx.beginPath();
      ctx.arc(x, y, s * 0.4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, s * 0.16, 0, Math.PI * 2);
      ctx.fill();
    } else if (state.brushShape === 'spray') {
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = Math.random() * (s * 0.5);
        ctx.fillRect(x + Math.cos(a) * d, y + Math.sin(a) * d, 1.8, 1.8);
      }
    } else if (state.brushShape === 'leaf') {
      ctx.beginPath();
      ctx.moveTo(x, y - s * 0.5);
      ctx.quadraticCurveTo(x + s * 0.4, y, x, y + s * 0.5);
      ctx.quadraticCurveTo(x - s * 0.4, y, x, y - s * 0.5);
      ctx.fill();
    } else if (state.brushShape === 'paw') {
      ctx.beginPath();
      ctx.arc(x, y + s * 0.12, s * 0.24, 0, Math.PI * 2);
      ctx.fill();
      const toes = [
        { dx: -0.26, dy: -0.22, r: 0.1 },
        { dx: -0.1, dy: -0.34, r: 0.1 },
        { dx: 0.1, dy: -0.34, r: 0.1 },
        { dx: 0.26, dy: -0.22, r: 0.1 }
      ];
      toes.forEach(t => {
        ctx.beginPath();
        ctx.arc(x + t.dx * s, y + t.dy * s, s * t.r, 0, Math.PI * 2);
        ctx.fill();
      });
    } else if (state.brushShape === 'sun') {
      ctx.beginPath();
      ctx.arc(x, y, s * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, s * 0.12);
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * (s * 0.28), y + Math.sin(a) * (s * 0.28));
        ctx.lineTo(x + Math.cos(a) * (s * 0.48), y + Math.sin(a) * (s * 0.48));
        ctx.stroke();
      }
    } else if (state.brushShape === 'music') {
      // Nota Musical Colcheia com bandeirola (♪)
      ctx.beginPath();
      ctx.ellipse(x - s * 0.15, y + s * 0.22, s * 0.18, s * 0.12, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x + s * 0.02, y - s * 0.44, Math.max(2, s * 0.08), s * 0.66);
      ctx.beginPath();
      ctx.moveTo(x + s * 0.02, y - s * 0.44);
      ctx.quadraticCurveTo(x + s * 0.38, y - s * 0.32, x + s * 0.25, y - s * 0.1);
      ctx.quadraticCurveTo(x + s * 0.22, y - s * 0.28, x + s * 0.02, y - s * 0.32);
      ctx.fill();
    } else if (state.brushShape === 'music-beam') {
      // Notas Ligadas Duplas (♫)
      ctx.beginPath();
      ctx.ellipse(x - s * 0.25, y + s * 0.25, s * 0.15, s * 0.1, -0.3, 0, Math.PI * 2);
      ctx.ellipse(x + s * 0.18, y + s * 0.12, s * 0.15, s * 0.1, -0.3, 0, Math.PI * 2);
      ctx.fill();
      const stemW = Math.max(2, s * 0.07);
      ctx.fillRect(x - s * 0.13, y - s * 0.32, stemW, s * 0.57);
      ctx.fillRect(x + s * 0.3, y - s * 0.45, stemW, s * 0.57);
      ctx.beginPath();
      ctx.moveTo(x - s * 0.13, y - s * 0.32);
      ctx.lineTo(x + s * 0.3 + stemW, y - s * 0.45);
      ctx.lineTo(x + s * 0.3 + stemW, y - s * 0.33);
      ctx.lineTo(x - s * 0.13, y - s * 0.2);
      ctx.closePath();
      ctx.fill();
    } else if (state.brushShape === 'music-clef') {
      // Clave de Sol (𝄞)
      ctx.lineWidth = Math.max(1.8, s * 0.09);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(x - s * 0.08, y + s * 0.42, s * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, y + s * 0.38);
      ctx.lineTo(x, y - s * 0.25);
      ctx.quadraticCurveTo(x + s * 0.22, y - s * 0.48, x, y - s * 0.48);
      ctx.quadraticCurveTo(x - s * 0.26, y - s * 0.48, x - s * 0.2, y + s * 0.05);
      ctx.quadraticCurveTo(x - s * 0.15, y + s * 0.32, x + s * 0.18, y + s * 0.18);
      ctx.quadraticCurveTo(x + s * 0.24, y + s * 0.02, x + s * 0.05, y - s * 0.02);
      ctx.quadraticCurveTo(x - s * 0.12, y - s * 0.02, x - s * 0.05, y + s * 0.12);
      ctx.stroke();
    } else if (state.brushShape === 'music-sharp') {
      // Sustenido (♯)
      const barW = Math.max(2, s * 0.07);
      ctx.fillRect(x - s * 0.18, y - s * 0.45, barW, s * 0.9);
      ctx.fillRect(x + s * 0.11, y - s * 0.45, barW, s * 0.9);
      ctx.lineWidth = Math.max(2, s * 0.13);
      ctx.beginPath();
      ctx.moveTo(x - s * 0.38, y - s * 0.08);
      ctx.lineTo(x + s * 0.38, y - s * 0.22);
      ctx.moveTo(x - s * 0.38, y + s * 0.2);
      ctx.lineTo(x + s * 0.38, y + s * 0.06);
      ctx.stroke();
    } else if (state.brushShape === 'music-flat') {
      // Bemol (♭)
      const barW = Math.max(2, s * 0.08);
      ctx.fillRect(x - s * 0.16, y - s * 0.5, barW, s);
      ctx.lineWidth = Math.max(2, s * 0.1);
      ctx.beginPath();
      ctx.moveTo(x - s * 0.16, y + s * 0.08);
      ctx.bezierCurveTo(x + s * 0.35, y - s * 0.1, x + s * 0.35, y + s * 0.48, x - s * 0.16, y + s * 0.48);
      ctx.stroke();
    } else if (state.brushShape === 'music-quarter') {
      // Semínima (♩)
      ctx.beginPath();
      ctx.ellipse(x - s * 0.12, y + s * 0.25, s * 0.18, s * 0.12, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x + s * 0.05, y - s * 0.45, Math.max(2, s * 0.08), s * 0.7);
    } else if (state.brushShape === 'fuzzy') {
      ctx.beginPath();
      ctx.arc(x, y, s * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 14; i++) {
        const a = (i * Math.PI * 2) / 14;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * (s * 0.18), y + Math.sin(a) * (s * 0.18));
        ctx.lineTo(x + Math.cos(a) * (s * 0.48), y + Math.sin(a) * (s * 0.48));
        ctx.stroke();
      }
    } else if (state.brushShape === 'hbar') {
      ctx.fillRect(x - s * 0.5, y - s * 0.15, s, s * 0.3);
    } else if (state.brushShape === 'vbar') {
      ctx.fillRect(x - s * 0.15, y - s * 0.5, s * 0.3, s);
    }
    ctx.restore();
  }

  function drawBrushSegment(x1, y1, x2, y2) {
    ctx.save();
    ctx.strokeStyle = state.currentColor;
    ctx.fillStyle = state.currentColor;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (state.brushShape.startsWith('circle')) {
      ctx.lineWidth = state.brushSize;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    } else if (state.brushShape === 'square') {
      ctx.lineWidth = state.brushSize;
      ctx.lineCap = 'square';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    } else {
      const dist = Math.hypot(x2 - x1, y2 - y1);
      const step = Math.max(3, state.brushSize * 0.28);
      const count = Math.ceil(dist / step);
      for (let i = 1; i <= count; i++) {
        const ix = x1 + (x2 - x1) * (i / count);
        const iy = y1 + (y2 - y1) * (i / count);
        drawBrushPoint(ix, iy);
      }
    }
    ctx.restore();
  }

  function eraseAt(x, y) {
    ctx.save();
    ctx.fillStyle = state.backgroundColor;
    ctx.beginPath();
    ctx.arc(x, y, state.eraserSize / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Magic Dispatcher (37 Effects)
  function applyMagic(x, y, lastX, lastY) {
    const s = state.magicSize || 26;
    switch (state.magicType) {
      case 'rainbow': magic.drawRainbow(ctx, x, y, lastX, lastY, s); break;
      case 'neon': magic.drawNeon(ctx, x, y, lastX, lastY, s, state.currentColor); break;
      case 'flowers': magic.drawBloomingFlowers(ctx, x, y, s, state.currentColor); break;
      case 'bubbles': magic.drawBubbles(ctx, x, y, s, state.currentColor); break;
      case 'sparkles': magic.drawSparkles(ctx, x, y, s); break;
      case 'grass': magic.drawGrass(ctx, x, y, s); break;
      case 'chalk': magic.drawChalk(ctx, x, y, lastX, lastY, s, state.currentColor); break;
      case 'drip': magic.drawDrip(ctx, x, y, s, state.currentColor); break;
      case 'confetti': magic.drawConfetti(ctx, x, y, s); break;
      case 'kaleidoscope': magic.drawKaleidoscope(ctx, x, y, lastX, lastY, s, state.currentColor, canvas.width, canvas.height); break;
      case 'bricks': magic.drawBricks(ctx, x, y, lastX, lastY, s); break;
      case 'rails': magic.drawRails(ctx, x, y, lastX, lastY, s); break;
      case 'snowflakes': magic.drawSnowflakes(ctx, x, y, s); break;
      case 'rain': magic.drawRain(ctx, x, y, s); break;
      case 'lightning': magic.drawLightning(ctx, x, y, lastX, lastY, s); break;
      case 'fireworks': magic.drawFireworks(ctx, x, y, s); break;
      case 'mosaic': magic.drawMosaic(ctx, x, y, s); break;
      case 'checkerboard': magic.drawCheckerboard(ctx, x, y, s, state.currentColor); break;
      case 'fur': magic.drawFur(ctx, x, y, lastX, lastY, s, state.currentColor); break;
      case 'string-art': magic.drawStringArt(ctx, x, y, lastX, lastY, s, state.currentColor); break;
      case 'glow': magic.drawGlow(ctx, x, y, lastX, lastY, s, state.currentColor); break;
      case 'tv': magic.drawTV(ctx, x, y, s); break;
      case 'pixelate': magic.applyPixelate(ctx, x, y, s * 1.5); break;
      case 'invert': magic.applyInvert(ctx, x, y, s * 1.5); break;
      case 'blur': magic.applyBlur(ctx, x, y, s * 1.5); break;
      case 'darken': magic.applyDarken(ctx, x, y, s * 1.5); break;
      case 'lighten': magic.applyLighten(ctx, x, y, s * 1.5); break;
      case 'tint': magic.applyTint(ctx, x, y, s * 1.5, state.currentColor); break;
      case 'grayscale': magic.applyGrayscale(ctx, x, y, s * 1.5); break;
      case 'sepia': magic.applySepia(ctx, x, y, s * 1.5); break;
      case 'emboss': magic.applyEmboss(ctx, x, y, s * 1.5); break;
      case 'edges': magic.applyEdges(ctx, x, y, s * 1.5); break;
      case 'fisheye': magic.applyFisheye(ctx, x, y, s * 1.5); break;
      case 'twirl': magic.applyTwirl(ctx, x, y, s * 1.5); break;
      case 'waves': magic.applyWaves(ctx, x, y, s * 1.5); break;
      case 'sharpen': magic.applySharpen(ctx, x, y, s * 1.5); break;
      case 'smudge': magic.applySmudge(ctx, x, y, lastX, lastY, s * 1.5); break;
    }
  }

  function drawLinePreview(x1, y1, x2, y2) {
    ctx.save();
    ctx.strokeStyle = state.currentColor;
    ctx.lineWidth = state.brushSize;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  // Shapes Drawing with Center-Based Rotation and Dual Color
  function drawShapePreview(x1, y1, x2, y2) {
    ctx.save();
    let w = x2 - x1;
    let h = y2 - y1;

    if (state.shapeProportional || window.shiftKeyPressed) {
      const side = Math.max(Math.abs(w), Math.abs(h));
      w = w < 0 ? -side : side;
      h = h < 0 ? -side : side;
    }

    const minX = Math.min(x1, x1 + w);
    const minY = Math.min(y1, y1 + h);
    const absW = Math.max(2, Math.abs(w));
    const absH = Math.max(2, Math.abs(h));
    const cx = minX + absW / 2;
    const cy = minY + absH / 2;

    ctx.translate(cx, cy);
    if (state.shapeRotation !== 0) {
      ctx.rotate((state.shapeRotation * Math.PI) / 180);
    }

    ctx.strokeStyle = state.shapeMode === 'both' ? '#1E293B' : state.currentColor;
    ctx.fillStyle = state.currentColor;
    ctx.lineWidth = state.shapeStrokeWidth || 6;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    const rx = absW / 2;
    const ry = absH / 2;

    ctx.beginPath();

    if (state.shapeType === 'rectangle') {
      ctx.rect(-rx, -ry, absW, absH);
    } else if (state.shapeType === 'circle') {
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    } else if (state.shapeType === 'roundRect') {
      const r = Math.min(22, absW / 4, absH / 4);
      if (ctx.roundRect) ctx.roundRect(-rx, -ry, absW, absH, r);
      else ctx.rect(-rx, -ry, absW, absH);
    } else if (state.shapeType === 'triangle') {
      ctx.moveTo(0, -ry);
      ctx.lineTo(rx, ry);
      ctx.lineTo(-rx, ry);
      ctx.closePath();
    } else if (state.shapeType === 'diamond') {
      ctx.moveTo(0, -ry);
      ctx.lineTo(rx, 0);
      ctx.lineTo(0, ry);
      ctx.lineTo(-rx, 0);
      ctx.closePath();
    } else if (state.shapeType === 'star') {
      drawStar(ctx, 0, 0, 5, Math.max(rx, ry), Math.max(rx, ry) * 0.45, false);
    } else if (state.shapeType === 'heart') {
      drawHeart(ctx, -rx, -ry, absW, absH);
    } else if (state.shapeType === 'speech') {
      drawSpeechBubble(ctx, -rx, -ry, absW, absH);
    } else if (state.shapeType === 'thought') {
      ctx.arc(0, -ry * 0.2, ry * 0.7, 0, Math.PI * 2);
    } else if (state.shapeType === 'cloud') {
      drawCloud(ctx, -rx, -ry, absW, absH);
    } else if (state.shapeType === 'pentagon') {
      drawPolygon(ctx, 0, 0, 5, Math.max(rx, ry));
    } else if (state.shapeType === 'hexagon') {
      drawPolygon(ctx, 0, 0, 6, Math.max(rx, ry));
    } else if (state.shapeType === 'octagon') {
      drawPolygon(ctx, 0, 0, 8, Math.max(rx, ry));
    } else if (state.shapeType === 'arrow') {
      ctx.moveTo(0, -ry);
      ctx.lineTo(rx, 0);
      ctx.lineTo(rx * 0.4, 0);
      ctx.lineTo(rx * 0.4, ry);
      ctx.lineTo(-rx * 0.4, ry);
      ctx.lineTo(-rx * 0.4, 0);
      ctx.lineTo(-rx, 0);
      ctx.closePath();
    } else if (state.shapeType === 'lightning') {
      ctx.moveTo(rx * 0.2, -ry);
      ctx.lineTo(-rx * 0.6, 0);
      ctx.lineTo(0, 0);
      ctx.lineTo(-rx * 0.2, ry);
      ctx.lineTo(rx * 0.6, 0);
      ctx.lineTo(0, 0);
      ctx.closePath();
    } else if (state.shapeType === 'moon') {
      ctx.arc(0, 0, Math.max(rx, ry), 0.5 * Math.PI, 1.5 * Math.PI, false);
      ctx.quadraticCurveTo(rx * 0.3, 0, 0, ry);
      ctx.closePath();
    }

    if (state.shapeMode === 'fill') {
      ctx.fill();
    } else if (state.shapeMode === 'outline') {
      ctx.stroke();
    } else if (state.shapeMode === 'both') {
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  // Geometry Helpers
  function drawPolygon(ctx, cx, cy, sides, r) {
    const angle = (Math.PI * 2) / sides;
    for (let i = 0; i < sides; i++) {
      const a = i * angle - Math.PI / 2;
      const px = cx + Math.cos(a) * r;
      const py = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, autoFill = true) {
    let rot = (Math.PI / 2) * 3;
    const step = Math.PI / spikes;
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
      let x = cx + Math.cos(rot) * outerRadius;
      let y = cy + Math.sin(rot) * outerRadius;
      ctx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerRadius;
      y = cy + Math.sin(rot) * innerRadius;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    if (autoFill) ctx.fill();
  }

  function drawHeart(ctx, x, y, w, h) {
    ctx.moveTo(x + w / 2, y + h * 0.8);
    ctx.bezierCurveTo(x, y + h * 0.5, x, y, x + w / 2, y + h * 0.25);
    ctx.bezierCurveTo(x + w, y, x + w, y + h * 0.5, x + w / 2, y + h * 0.8);
  }

  function drawSpeechBubble(ctx, x, y, w, h) {
    const tailH = Math.min(20, h * 0.25);
    const bodyH = h - tailH;
    const r = Math.min(16, w / 6, bodyH / 6);
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + bodyH - r);
    ctx.quadraticCurveTo(x + w, y + bodyH, x + w - r, y + bodyH);
    ctx.lineTo(x + w * 0.45, y + bodyH);
    ctx.lineTo(x + w * 0.22, y + h);
    ctx.lineTo(x + w * 0.28, y + bodyH);
    ctx.lineTo(x + r, y + bodyH);
    ctx.quadraticCurveTo(x, y + bodyH, x, y + bodyH - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawCloud(ctx, x, y, w, h) {
    const cx = x + w / 2;
    const cy = y + h / 2;
    const rw = w / 2;
    const rh = h / 2;
    ctx.arc(cx - rw * 0.45, cy + rh * 0.1, rh * 0.42, 0, Math.PI * 2);
    ctx.arc(cx - rw * 0.15, cy - rh * 0.25, rh * 0.58, 0, Math.PI * 2);
    ctx.arc(cx + rw * 0.22, cy - rh * 0.2, rh * 0.55, 0, Math.PI * 2);
    ctx.arc(cx + rw * 0.48, cy + rh * 0.1, rh * 0.4, 0, Math.PI * 2);
    ctx.arc(cx, cy + rh * 0.28, rh * 0.5, 0, Math.PI * 2);
  }

  // Load Image File (PNG, JPG, SVG)
  function loadImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        commitInlineText(false);
        ctx.fillStyle = state.backgroundColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const scale = Math.min(canvas.width / img.width, canvas.height / img.height, 1);
        const w = img.width * scale;
        const h = img.height * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        ctx.drawImage(img, x, y, w, h);
        saveSnapshot();
        window.tuxAudio.playFanfare();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  if (fileInput) fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) loadImageFile(e.target.files[0]);
  });

  // Drag and Drop files onto Canvas
  ['dragenter', 'dragover'].forEach(n => container.addEventListener(n, (e) => { e.preventDefault(); dropOverlay.classList.add('visible'); }));
  ['dragleave', 'drop'].forEach(n => container.addEventListener(n, (e) => { e.preventDefault(); dropOverlay.classList.remove('visible'); }));
  container.addEventListener('drop', (e) => {
    e.preventDefault();
    dropOverlay.classList.remove('visible');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]);
  });

  // =========================================================================
  // Custom Stamp Importer (Local File or Web URL)
  // =========================================================================
  let tempImportSvg = '';
  const tabPC = document.getElementById('tabImportPC');
  const tabURL = document.getElementById('tabImportURL');
  const secPC = document.getElementById('sectionImportPC');
  const secURL = document.getElementById('sectionImportURL');
  const btnPickStamp = document.getElementById('btnPickStampFile');
  const inputURL = document.getElementById('inputStampURL');
  const btnLoadURL = document.getElementById('btnLoadURLStamp');
  const previewBox = document.getElementById('importPreviewBox');
  const nameInput = document.getElementById('inputStampName');
  const checkColorable = document.getElementById('checkColorableStamp');
  const btnSaveCustom = document.getElementById('btnSaveCustomStamp');

  if (tabPC && tabURL) {
    tabPC.addEventListener('click', () => {
      tabPC.classList.add('active'); tabURL.classList.remove('active');
      secPC.style.display = 'flex'; secURL.style.display = 'none';
    });
    tabURL.addEventListener('click', () => {
      tabURL.classList.add('active'); tabPC.classList.remove('active');
      secPC.style.display = 'none'; secURL.style.display = 'flex';
    });
  }

  if (btnPickStamp) btnPickStamp.addEventListener('click', () => stampFileInput.click());

  if (stampFileInput) stampFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const res = ev.target.result;
      nameInput.value = file.name.replace(/\.[^/.]+$/, '');
      if (file.type === 'image/svg+xml' || file.name.endsWith('.svg')) {
        tempImportSvg = res;
        previewBox.innerHTML = res;
      } else {
        // Image format: wrap in SVG
        tempImportSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><image href="${res}" width="100" height="100" preserveAspectRatio="xMidYMid meet"/></svg>`;
        previewBox.innerHTML = `<img src="${res}" style="max-width:100%; max-height:100%;">`;
      }
    };
    if (file.type === 'image/svg+xml' || file.name.endsWith('.svg')) {
      reader.readAsText(file);
    } else {
      reader.readAsDataURL(file);
    }
  });

  if (btnLoadURL) btnLoadURL.addEventListener('click', () => {
    const url = inputURL.value.trim();
    if (!url) return;
    nameInput.value = 'Web Stamp';
    tempImportSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><image href="${url}" width="100" height="100" preserveAspectRatio="xMidYMid meet"/></svg>`;
    previewBox.innerHTML = `<img src="${url}" style="max-width:100%; max-height:100%;">`;
  });

  if (btnSaveCustom) btnSaveCustom.addEventListener('click', () => {
    if (!tempImportSvg) return;
    const newStamp = {
      id: `custom-${Date.now()}`,
      name: nameInput.value.trim() || 'Meu Carimbo',
      category: 'custom',
      colorable: checkColorable.checked,
      svg: tempImportSvg
    };
    customStamps.push(newStamp);
    try {
      localStorage.setItem('retux_custom_stamps', JSON.stringify(customStamps));
    } catch(e) {}
    state.activeStamp = newStamp.id;
    state.activeStampCategory = 'custom';
    closeModal('modalImportStamp');
    updateSubOptions();
    updateStampPreview();
    window.tuxAudio.playFanfare();
  });

  // Modals Controller
  function openModal(id) {
    document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('open'));
    const modal = document.getElementById(id);
    if (modal) modal.classList.add('open');
    window.tuxAudio.playPop(500);
  }

  function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('open');
  }

  document.querySelectorAll('[data-close-modal]').forEach(el => {
    el.addEventListener('click', () => closeModal(el.dataset.closeModal));
  });

  // New Canvas Modal
  let selectedBgColor = '#FFFFFF';
  document.querySelectorAll('.bg-choice-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.bg-choice-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedBgColor = card.dataset.bgcolor || '#FFFFFF';
      window.tuxAudio.playPop(480);
    });
  });

  const btnConfirmNew = document.getElementById('btnConfirmNew');
  if (btnConfirmNew) btnConfirmNew.addEventListener('click', () => {
    commitInlineText(false);
    state.backgroundColor = selectedBgColor;
    ctx.fillStyle = state.backgroundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    window.tuxAudio.playClear();
    closeModal('modalNew');
    saveSnapshot();
  });

  // Sound Mode Toggle (Official vs Synthetic)
  const btnSoundMode = document.getElementById('btnSoundMode');
  const soundModeText = document.getElementById('soundModeText');
  const soundIcon = document.getElementById('soundIcon');
  if (btnSoundMode) {
    const updateSoundUI = () => {
      const mode = window.tuxAudio.mode;
      if (mode === 'official') {
        soundIcon.textContent = '🎵';
        soundModeText.textContent = t('audio_official');
      } else {
        soundIcon.textContent = '🎶';
        soundModeText.textContent = t('audio_synthetic');
      }
    };
    updateSoundUI();
    btnSoundMode.addEventListener('click', () => {
      const nextMode = window.tuxAudio.mode === 'official' ? 'synthetic' : 'official';
      window.tuxAudio.setMode(nextMode);
      updateSoundUI();
      window.tuxAudio.playPop(650);
    });
  }

  // Language Toggle Button
  const btnLangToggle = document.getElementById('btnLangToggle');
  if (btnLangToggle) {
    btnLangToggle.addEventListener('click', () => {
      const nextLang = currentLang === 'pt-BR' ? 'en-US' : 'pt-BR';
      updateAppLanguage(nextLang);
      updateSubOptions();
      window.tuxAudio.playPop(700);
    });
  }

  // Audio Mute Toggle
  const btnAudioToggle = document.getElementById('btnAudioToggle');
  if (btnAudioToggle) {
    btnAudioToggle.addEventListener('click', () => {
      const enabled = window.tuxAudio.toggle();
      btnAudioToggle.innerHTML = enabled
        ? `<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z M15.54 8.46a5 5 0 0 1 0 7.07 M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`
        : `<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z M23 9l-6 6 M17 9l6 6"/></svg>`;
    });
  }

  // Fullscreen
  const btnFullscreen = document.getElementById('btnFullscreen');
  if (btnFullscreen) {
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });
  }

  // Mascot Click reaction
  if (tuxAvatar) {
    tuxAvatar.addEventListener('click', () => {
      window.tuxAudio.playOfficial('assets/sounds/giggle.wav', () => window.tuxAudio.playPop(720));
      const quotes = currentLang === 'pt-BR' ? [
        'Olá! Eu sou o Tux, seu amiguinho de pintura!',
        'Que desenho lindo você está fazendo!',
        'Gostou dos carimbos? Você pode aumentá-los, girá-los e mudá-los de cor!',
        'Use o novo botão de rotação para virar as formas e carimbos de qualquer lado!'
      ] : [
        'Hi! I am Tux, your drawing buddy!',
        'What a wonderful drawing you are making!',
        'Did you know you can resize, rotate and change colors of stamps?',
        'Try the rotation sliders to spin shapes and stamps around!'
      ];
      setTuxTip(quotes[Math.floor(Math.random() * quotes.length)]);
    });
  }

  // Sidebar Resizer Dragging
  const rightSidebarResizer = document.getElementById('rightSidebarResizer');
  const optionsSidebar = document.getElementById('optionsSidebar');
  const workspaceEl = document.getElementById('workspace');

  if (rightSidebarResizer && optionsSidebar && workspaceEl) {
    let isResizing = false;
    const savedWidth = localStorage.getItem('retux_right_sidebar_width');
    if (savedWidth) {
      const parsed = parseInt(savedWidth);
      if (parsed >= 190 && parsed <= 550) optionsSidebar.style.width = `${parsed}px`;
    }

    rightSidebarResizer.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isResizing = true;
      rightSidebarResizer.classList.add('dragging');
      rightSidebarResizer.setPointerCapture(e.pointerId);
    });

    rightSidebarResizer.addEventListener('pointermove', (e) => {
      if (!isResizing) return;
      const workspaceRect = workspaceEl.getBoundingClientRect();
      const newWidth = workspaceRect.right - e.clientX - 6;
      const clampedWidth = Math.max(190, Math.min(550, newWidth));
      optionsSidebar.style.width = `${clampedWidth}px`;
      resizeCanvas(true);
    });

    const stopResizing = () => {
      if (isResizing) {
        isResizing = false;
        rightSidebarResizer.classList.remove('dragging');
        resizeCanvas(true);
        const curW = parseInt(optionsSidebar.style.width);
        if (curW) localStorage.setItem('retux_right_sidebar_width', curW);
      }
    };
    rightSidebarResizer.addEventListener('pointerup', stopResizing);
    rightSidebarResizer.addEventListener('pointercancel', stopResizing);
  }

  // Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    if (document.activeElement === inlineTextInput) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      e.preventDefault(); redo();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault(); saveDrawing();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
      e.preventDefault(); copyDrawingToClipboard();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
      e.preventDefault(); fileInput.click();
    }
  });

  window.addEventListener('resize', () => resizeCanvas(true));

  // Boot Application
  updateAppLanguage(currentLang);
  resizeCanvas(false);
  saveSnapshot();
  renderPalette();
  updateSubOptions();
  setTuxTip(t('welcome_tip'));
});
  </script>
</body>
</html>
