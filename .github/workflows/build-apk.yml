name: Build Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (Pillow)
        run: |
          pip install Pillow

      - name: Install npm dependencies
        run: |
          npm ci || npm install

      - name: Build Web distribution for Android
        run: |
          node scripts/build-www.js

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Ensure app icons and launcher assets
        run: |
          python scripts/prepare-android-assets.py

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK binary
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" RetuxPaint.apk
          cp "$APK_PATH" RetuxPaint-v1.0.2.apk
          ls -la RetuxPaint*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetuxPaint-Android-APK
          path: RetuxPaint-v1.0.2.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # If triggered on a tag, upload directly to that tag's release
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Uploading APK to release $TAG..."
            gh release upload "$TAG" RetuxPaint.apk RetuxPaint-v1.0.2.apk --clobber || true
          else
            # If on master or workflow_dispatch, upload to latest release if exists
            LATEST_TAG=$(gh release list --limit 1 | awk '{print $3}')
            if [ -n "$LATEST_TAG" ]; then
              echo "Uploading APK to latest release $LATEST_TAG..."
              gh release upload "$LATEST_TAG" RetuxPaint.apk RetuxPaint-v1.0.2.apk --clobber || true
            fi
          fi
